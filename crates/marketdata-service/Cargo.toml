[package]
name = "marketdata-service"
version.workspace = true
edition.workspace = true
description = "Market data message service for the take-home assignment."
# `cargo run -p marketdata-service` 默认跑 server 而非 client；避免 reviewer
# 在两个 binary 之间被 cargo 询问 --bin。
default-run = "marketdata-service"

[dependencies]
# 错误处理：service 层统一用 `Box<dyn Error + Send + Sync + 'static>` (alias
# `BoxError`，见 `lib.rs`)。
# - 8 byte thin pointer，等同 anyhow::Error 的 size
# - `?` 自动从所有 `Error + Send + Sync + 'static` 转换，零样板
# - 零依赖（纯 std）；library 层另用 thiserror 定义具体 enum
# 失去的能力：anyhow 的 backtrace 懒加载与 `.context()` ergonomic；
# 后者用 `.map_err(|e| format!("...: {e}").into())` 替代。

# Phase 1 仅用到 tokio::sync (broadcast / mpsc / Notify) + spawn；
# "full" 是 Phase 2 接 tonic 后才真正用满。
tokio = { workspace = true }

# Snapshot 表底层：DashMap<Figi, BookMessage>。
dashmap = { workspace = true }

# 上游 feed（GUIDELINE I3：唯一接点）。
feed-sim = { workspace = true }

# 共享型别：BookMessage / Figi 等。
marketdata-types = { workspace = true }

# Phase 2: gRPC wire 层依赖。
tonic = { workspace = true }
prost = { workspace = true }
# 把 mpsc::Receiver 包成 Stream，喂给 tonic 的 server-streaming 返回值。
tokio-stream = { workspace = true }

[build-dependencies]
# .proto -> Rust 代码生成（在 OUT_DIR；src/grpc.rs 用 tonic::include_proto! 拉回）。
tonic-build = { workspace = true }
# 内置 protoc 二进制，build.rs 注入 PROTOC env var；reviewer 不需手动装 protobuf-compiler。
protoc-bin-vendored = { workspace = true }

[lints.rust]
unused_must_use = "warn"

# Server entrypoint（Phase 1 起即存在）。
[[bin]]
name = "marketdata-service"
path = "src/main.rs"

# Phase 2 新增：sample client（README §6）。
[[bin]]
name = "client"
path = "src/bin/client.rs"
