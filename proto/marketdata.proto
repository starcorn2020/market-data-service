// Wire schema for market-data-service.
//
// Two RPCs map 1:1 onto the assignment's two APIs:
//   * GetSnapshots -> request/response  (batch latest-snapshot lookup)
//   * Subscribe    -> server-streaming
//
// Both RPCs take a batch of FIGIs so the two surfaces stay symmetric.

syntax = "proto3";
package marketdata.v1;

service MarketData {
    // Latest snapshot for one or more FIGIs. Returns one SnapshotEntry per
    // requested FIGI, in the same order. `NotYet` per entry is a first-class
    // response ("clearly-defined no data yet"), distinct from "this FIGI does
    // not exist" — the server cannot tell those apart in 3-day scope.
    //
    // No cross-FIGI atomicity: each entry is the latest snapshot for its
    // FIGI at the moment the server read it; ingest may have written other
    // FIGIs between reads. Semantically equivalent to issuing N parallel
    // single-FIGI lookups.
    rpc GetSnapshots(GetSnapshotsRequest) returns (GetSnapshotsResponse);

    // Live updates for one or more FIGIs. Server-streaming: server pushes
    // each new BookMessage as it lands in the snapshot table. Drop semantics
    // are visible via BookUpdate.dropped_total (see field comment).
    rpc Subscribe(SubscribeRequest) returns (stream BookUpdate);
}

message GetSnapshotsRequest {
    repeated string figis = 1;
}

message GetSnapshotsResponse {
    // One entry per requested FIGI, in request order.
    repeated SnapshotEntry entries = 1;
}

// Per-FIGI snapshot result inside a GetSnapshots response. `figi` is echoed
// back so the client does not need to depend on entry order to match
// requests with results.
message SnapshotEntry {
    string figi = 1;
    oneof result {
        Book   found   = 2;
        NotYet not_yet = 3;
    }
}

message NotYet {}

message SubscribeRequest {
    repeated string figis = 1;
}

message BookUpdate {
    Book book = 1;

    // Server-side cumulative drop count for this subscription. The client
    // computes lost-in-interval as (curr.dropped_total - prev.dropped_total).
    // Cumulative (not delta) so the client auto-aligns on first message and
    // tolerates reordering / single message loss.
    uint64 dropped_total = 2;
}

message Book {
    string figi        = 1;
    uint64 gateway_seq = 2;
    int64  gateway_ts  = 3;
    repeated Level bids = 4;
    repeated Level asks = 5;
}

message Level {
    double price  = 1;
    float  qty    = 2;
    uint32 orders = 3;
}
